name: Sync qist/tvbox（跑完自删）

on:
  workflow_dispatch: {}   # 只手动跑一次，别再挂 schedule

permissions:
  contents: write

concurrency:
  group: write-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream & origin
        run: |
          git remote add upstream https://github.com/qist/tvbox.git || true
          git remote set-url upstream https://github.com/qist/tvbox.git
          OK=0
          for i in 1 2 3; do
            if git fetch upstream --no-tags --prune && git fetch origin --prune; then
              OK=1; break
            fi
            echo "第 $i 次 fetch 失败，10 秒后重试"
            sleep 10
          done
          [ "$OK" = "1" ] || { echo "::error::拉取失败，终止"; exit 1; }

      - name: 合并上游并删除工作流
        run: |
          git checkout master
          # 起点就是 origin/master，不会 behind；用 merge 而非 pull，避开图5 的 fatal
          git merge --no-edit --allow-unrelated-histories -X theirs upstream/master || {
            git merge --abort
            echo "::error::合并失败，终止（工作流保留，可重跑）"
            exit 1
          }
          # ↓↓↓ 改成这个 yml 在仓库里的实际文件名
          git rm -f ".github/workflows/sync-tvbox.yml" || echo "文件已不存在，跳过"
          # 若「更新源」那个 workflow 也想一并删，放开下一行并改名
          # git rm -f ".github/workflows/更新源.yml" || true
          git commit -m "对齐上游并移除同步工作流" || echo "无变更可提交"
          git push origin master
          echo "已推送，工作流文件已从 master 移除"
